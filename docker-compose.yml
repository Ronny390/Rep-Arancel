version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: oracle-arancel
    environment:
      - ORACLE_PWD=postgres
    ports:
      - "1521:1521"
    volumes:
      # Volúmen para que los datos persistan si se apaga el contenedor
      - oracle-data:/opt/oracle/oradata
      # Inyectar script de auto-arranque en la carpeta mágica de Oracle
      - ./sql/init_db.sh:/opt/oracle/scripts/startup/01_init_db.sh
      # Inyectar toda nuestra carpeta sql para que el script pueda leerla
      - ./sql:/opt/oracle/sql_scripts
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-arancel
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=h2
    volumes:
      # Volúmen para que los dashboards creados en Metabase no se borren
      - metabase-data:/metabase-data
      # Inyectar el driver JDBC de Oracle por temas de licencia
      - ./plugins:/plugins
    depends_on:
      oracle-db:
        condition: service_healthy

volumes:
  oracle-data:
  metabase-data:
